[package]
name = "shellrs-ssh"
version = "0.1.0"
edition = "2024"
publish = false
description = "ShellRS SSH core: logins, host keys, channels and file transfers through the shell"
license = "MIT"
repository = "https://github.com/dream10201/shell-rs"

[dependencies]
anyhow = "1"
# HTTP proxies' Basic authentication.
base64 = "0.23"
# Where the default private keys are looked for, unless told otherwise.
dirs = "7"
futures = "0.3"
russh = "0.65"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
zeroize = "1"

[target.'cfg(target_vendor = "apple")'.dependencies]
# `getaddrinfo(3)`, for NAT64.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["process", "rt-multi-thread", "test-util"] }
tempfile = "3"
