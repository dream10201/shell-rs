  en: systemctl exited with status %{status}

# On a service a timer starts, and on a timer whose service failed.
services.tag.scheduled:
  zh-CN: 定时任务
  en: Scheduled
services.tag.failed_last:
  zh-CN: 上次运行失败
  en: Last run failed

