_version: 2

app_lock.title:
  zh-CN: 应用锁
  en: App lock
app_lock.description:
  zh-CN: ShellRS 的全部数据都用应用锁密码加密保存，每次启动和锁定后都要输入密码。
  en: Everything ShellRS keeps is encrypted with the app lock password, which is asked for at every start and after locking.
app_lock.change:
  zh-CN: 修改密码…
  en: Change password…
app_lock.lock_now:
  zh-CN: 立即锁定
  en: Lock now
app_lock.change_title:
  zh-CN: 修改应用锁密码
  en: Change app lock password
app_lock.current_password:
  zh-CN: 应用锁密码
  en: App lock password
app_lock.new_password:
  zh-CN: 新密码
  en: New password
app_lock.repeat_password:
  zh-CN: 确认新密码
  en: Confirm new password
app_lock.password_help:
  zh-CN: 至少 8 个字符。请妥善保管：忘记密码，数据就再也打不开。
  en: "At least 8 characters. Keep it safe: without it the data can never be opened again."
app_lock.change_commit:
  zh-CN: 保存密码
  en: Save password
app_lock.locked:
  zh-CN: ShellRS 已锁定
  en: ShellRS is locked
app_lock.unlock_description:
  zh-CN: 输入应用锁密码以继续。
  en: Enter your app lock password to continue.
app_lock.unlock:
  zh-CN: 解锁
  en: Unlock
app_lock.too_short:
  zh-CN: 密码至少需要 8 个字符。
  en: Use at least 8 characters for the password.
app_lock.mismatch:
  zh-CN: 两次输入的密码不一致。
  en: The passwords do not match.
app_lock.enter_password:
  zh-CN: 请输入应用锁密码。
  en: Enter the app lock password.
app_lock.wrong_password:
  zh-CN: 应用锁密码不正确，请重新输入。
  en: The app lock password is incorrect. Try again.
app_lock.unavailable:
  zh-CN: 现在不能进行这项操作，请稍后重试。
  en: That can’t be done right now. Try again later.
app_lock.failed:
  zh-CN: 无法保存或读取加密数据：%{error}
  en: "Couldn’t read or save the encrypted data: %{error}"
app_lock.keywords:
  zh-CN: 应用锁,密码,安全,启动,解锁,锁定,锁屏
  en: app lock,password,security,startup,unlock,lock,lock screen

app_lock.start_failed:
  zh-CN: 无法启动 ShellRS。请检查是否已有 ShellRS 正在运行，以及数据目录的访问权限，然后重新启动：%{error}
  en: "Could not start ShellRS. Check whether another copy is running and whether the data folder is accessible, then restart: %{error}"

app_lock.idle_title:
  zh-CN: 多久未操作自动锁定
  en: Lock after inactivity
app_lock.idle_description:
  zh-CN: 单位为分钟，设为 0 时不自动锁定。
  en: In minutes. Set to 0 to turn off automatic locking.

app_lock.screen_title:
  zh-CN: 电脑锁屏时锁定
  en: Lock when the computer locks
app_lock.screen_description:
  zh-CN: 电脑锁屏后，ShellRS 也一起锁定。
  en: ShellRS locks as soon as this computer’s screen is locked.

app_lock.damaged:
  zh-CN: 加密数据的密钥文件（vault.json）已损坏，无法解锁。
  en: The key file of the encrypted data (vault.json) is damaged, so it can’t be unlocked.
app_lock.setup_title:
  zh-CN: 设置应用锁密码
  en: Set the app lock password
app_lock.setup_description:
  zh-CN: ShellRS 用这个密码加密主机、密码、私钥、设置等全部数据，每次启动都要输入。
  en: ShellRS encrypts everything with this password, from hosts, passwords and private keys to settings, and asks for it at every start.
app_lock.setup_commit:
  zh-CN: 开始使用
  en: Get started
