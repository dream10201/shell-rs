  zh-CN: 系统服务
  en: Services
tools.kind.processes:
  zh-CN: 进程管理
  en: Processes
tools.kind.connections:
  zh-CN: 网络连接
  en: Network
tools.kind.monitor:
  zh-CN: 系统监控
  en: Monitor
tools.kind.projects:
  zh-CN: 项目
  en: Projects

# Shared by the tools.
tools.refresh:
  zh-CN: 刷新
  en: Refresh
tools.reading:
  zh-CN: 正在读取…
  en: Loading…
tools.read_failed:
  zh-CN: 读取失败：%{error}
  en: "Couldn’t load: %{error}"
tools.not_connected:
  zh-CN: 终端没有连接
  en: The terminal isn’t connected
tools.no_answer:
  zh-CN: 主机没有回答
  en: The host didn’t answer
tools.details_and_logs:
  zh-CN: 详情和日志
  en: Details and logs
tools.run:
  zh-CN: 执行
  en: Run
tools.menu.insert:
  zh-CN: 输入到终端
  en: Insert into terminal
tools.menu.details:
  zh-CN: 查看详情
