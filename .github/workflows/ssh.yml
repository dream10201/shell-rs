# The SSH core (crates/shellrs-ssh), on its own: it builds without GPUI,
# so this takes minutes. Its tests also run with the app's (`cargo test`)
# and on Windows (windows.yml), but for the file transfer's, which run
# their commands with this machine's `sh`.
name: ssh

on:
  push:
    branches: ["**"]
    paths:
      - "crates/shellrs-ssh/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ssh.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml picks the toolchain; this installs it with the
      # components it lists before the cache key is computed.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p shellrs-ssh --check
      - run: cargo clippy -p shellrs-ssh --all-targets -- -D warnings
      - run: cargo test --locked -p shellrs-ssh
