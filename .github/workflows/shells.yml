# ZMODEM against lrzsz's `sz` and `rz`, on a terminal and through busybox's
# telnetd (`terminal::zmodem::tests::lrzsz`, which installs them from
# Debian's packages), each in a container on a real terminal. The Macs this is developed on run it only
# with Docker Desktop up.
#
# A push runs it when the terminal's code, the test helpers or the dependencies
# change; run it by hand otherwise (Actions › shells › Run workflow).
name: shells

on:
  push:
    branches: ["**"]
    paths:
      - "src/terminal/**"
      - "src/testing.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/shells.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shells:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libfontconfig-dev \
            libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libdbus-1-dev libssl-dev
      # Pulled first, so that no test waits on a download.
      - name: Image
        run: docker pull --quiet debian:stable-slim
      # rust-toolchain.toml picks the toolchain; this installs it with the
      # components it lists before the cache key is computed.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib terminal::zmodem -- --include-ignored
