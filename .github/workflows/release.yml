# A release: push a tag `v<version>` matching Cargo.toml's version.
#
#   verify   the tag, the CHANGELOG sections (English and Chinese), the update keys
#   macos    per-architecture apps; update zip and DMG. Signed, notarized
#            and stapled when the Apple secrets are set, signed ad hoc
#            otherwise
#   windows  per-user Inno Setup installer (unsigned for now) and portable zip
#   linux    AppImage
#   publish  (environment `release`) signs the packages, creates the GitHub
#            release, and only then replaces the channel's manifest on the
#            `update` branch, which is what clients follow
#
# A tag with a pre-release (v0.3.0-beta.1) goes to the beta channel only. A
# stable release also becomes the beta channel's, unless beta is ahead.
#
# Running it by hand (workflow_dispatch) builds and packages from the
# current commit without publishing, to try the pipeline.
#
# Secrets, see docs/release.md:
#   repository: optional, for a notarized macOS app: APPLE_CERTIFICATE_P12
#               (base64), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#               APPLE_TEAM_ID, APPLE_API_KEY_P8 (base64), APPLE_API_KEY_ID,
#               APPLE_API_ISSUER
#   environment `release`: MINISIGN_SECRET_KEY, MINISIGN_PASSWORD (when the
#               key has one)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Version and channel
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      # The GitHub release takes the English section; the website shows
      # CHANGELOG.zh.md on its Chinese pages, so that one must have it too.
      - name: Release notes from CHANGELOG.md
        run: |
          version=${{ steps.version.outputs.version }}
          section() {
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' "$1" | sed -e '/./,$!d'
          }
          for changelog in CHANGELOG.md CHANGELOG.zh.md; do
            if [ -z "$(section "$changelog")" ]; then
              echo "::error::$changelog has no section ## [$version]"
              exit 1
            fi
          done
          section CHANGELOG.md > notes.md
          cat notes.md
      - name: The build knows the update keys
        run: |
          if grep -q 'pub const TRUSTED_KEYS: &\[&str\] = &\[\];' src/update/build_info.rs; then
            echo "::error::src/update/build_info.rs has no TRUSTED_KEYS: a release would reject every update"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  macos:
    needs: verify
    # GitHub's macos-14 runners are gone ("not supported", 2026-11).
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    timeout-minutes: 120
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.verify.outputs.version }}
      SHELLRS_UPDATE_CHANNEL: ${{ needs.verify.outputs.channel }}
      SHELLRS_COMMIT: ${{ github.sha }}
      SHELLRS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      NOTARIZED: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup target add "$ARCH-apple-darwin"
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}
      - name: Build the architecture-specific app
        run: |
          export SHELLRS_BUILD_DATE=$(date -u +%Y-%m-%d)
          cargo build --release --locked --bin shellrs --target "$ARCH-apple-darwin"
          mkdir -p dist build
          lipo "target/$ARCH-apple-darwin/release/shellrs" -verify_arch "${ARCH/aarch64/arm64}"
          packaging/macos/bundle.sh "target/$ARCH-apple-darwin/release/shellrs" "$VERSION" "$GITHUB_RUN_NUMBER" build
      - name: Sign ad hoc
        if: env.NOTARIZED != 'true'
        run: |
          codesign --force --deep --options runtime --sign - build/ShellRS.app
          codesign --verify --deep --strict --verbose=2 build/ShellRS.app
      - name: Sign
        if: env.NOTARIZED == 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          codesign --force --timestamp --options runtime --sign "$IDENTITY" build/ShellRS.app
          codesign --verify --deep --strict --verbose=2 build/ShellRS.app
      - name: Notarize and staple
        if: env.NOTARIZED == 'true'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent build/ShellRS.app "$RUNNER_TEMP/notarize.zip"
          packaging/macos/notarize.sh "$RUNNER_TEMP/notarize.zip"
          xcrun stapler staple build/ShellRS.app
      - name: Update package and disk image
        run: |
          # The update package: the bundle, zipped the way the updater
          # unzips it (ditto keeps the signature intact).
          ditto -c -k --keepParent build/ShellRS.app "dist/ShellRS-$VERSION-macos-$ARCH.app.zip"
          # The first-install disk image, with the Applications shortcut.
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R build/ShellRS.app "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          dmg="dist/ShellRS-$VERSION-macos-$ARCH.dmg"
          # hdiutil's own estimate of the image size once came out too small
          # for the app ("No space left on device"), so the size is given,
          # with room to spare; the compressed image is about half the app.
          # It also fails now and then with "Resource busy" on the runners.
          df -h "$RUNNER_TEMP" .
          size=$(( $(du -sm "$RUNNER_TEMP/dmg" | cut -f1) * 2 + 20 ))
          for attempt in 1 2 3; do
            hdiutil create -volname ShellRS -srcfolder "$RUNNER_TEMP/dmg" -ov \
              -fs HFS+ -size "${size}m" -format UDZO "$dmg" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
      - name: Sign and notarize the disk image
        if: env.NOTARIZED == 'true'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmg="dist/ShellRS-$VERSION-macos-$ARCH.dmg"
          codesign --force --timestamp --sign "$IDENTITY" "$dmg"
          packaging/macos/notarize.sh "$dmg"
          xcrun stapler staple "$dmg"
          spctl -a -vv -t install "$dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  windows:
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SHELLRS_UPDATE_CHANNEL: ${{ needs.verify.outputs.channel }}
      SHELLRS_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/setup-nasm@v1
      - name: Build
        shell: bash
        run: |
          export SHELLRS_BUILD_DATE=$(date -u +%Y-%m-%d)
          cargo build --release --locked --bin shellrs
      - name: Runtime
        shell: pwsh
        run: ./scripts/windows-runtime.ps1 target/release
      - name: Installer
        shell: pwsh
        run: |
          # windows-2025 ships Inno Setup 6.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y; }
          & $iscc "/DAppVersion=$env:VERSION" "/DBuildDir=$env:GITHUB_WORKSPACE\target\release" `
            "/O$env:GITHUB_WORKSPACE\dist" packaging\windows\shellrs.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable
        shell: pwsh
        run: |
          # The portable zip, also what a portable copy updates from: the
          # program at its root beside an empty data folder, which is what
          # makes a copy portable. 7-Zip keeps the empty folder;
          # Compress-Archive would drop it.
          $folder = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path (Join-Path $folder "data") | Out-Null
          Copy-Item "target\release\shellrs.exe" $folder
          $zip = "$env:GITHUB_WORKSPACE\dist\ShellRS-$env:VERSION-windows-x86_64-portable.zip"
          Push-Location $folder
          7z a -tzip -mx=9 $zip shellrs.exe data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          # The first path listed is the archive itself.
          $entries = 7z l -slt $zip | Select-String '^Path = ' |
            ForEach-Object { $_.Line.Substring(7) } | Select-Object -Skip 1
          if (Compare-Object @($entries) @('data', 'shellrs.exe')) {
            Write-Error "The portable zip holds: $($entries -join ', ')"
            exit 1
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  linux:
    needs: verify
    # Built in Ubuntu 20.04 so the AppImage runs on its glibc (2.31) and
    # later: Ubuntu 20.04, Debian 11, and the newer ones (issue #28).
    # GitHub has no 20.04 runners any more, hence the container.
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SHELLRS_UPDATE_CHANNEL: ${{ needs.verify.outputs.channel }}
      SHELLRS_COMMIT: ${{ github.sha }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git file \
            build-essential cmake clang pkg-config libfontconfig-dev \
            libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libdbus-1-dev libssl-dev
      - uses: actions/checkout@v7
      - name: Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install
      # Its own cache: build scripts compiled on a newer glibc do not run here.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-20.04
      - name: Build
        run: |
          export SHELLRS_BUILD_DATE=$(date -u +%Y-%m-%d)
          cargo build --release --locked --bin shellrs
      - name: Needs glibc 2.31 at most
        run: |
          needed=$(objdump -T target/release/shellrs | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "The binary needs $needed"
          test "$(printf '%s\n' "$needed" GLIBC_2.31 | sort -V | tail -1)" = GLIBC_2.31
      - name: AppImage
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          # No FUSE on the runner: let the tool unpack itself.
          export APPIMAGE_EXTRACT_AND_RUN=1
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" \
            packaging/linux/appimage.sh target/release/shellrs "$VERSION" dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  publish:
    needs: [verify, macos, windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      CHANNEL: ${{ needs.verify.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p dist
          cp artifacts/macos-aarch64/* artifacts/macos-x86_64/* artifacts/windows/* artifacts/linux/* dist/
          cp artifacts/notes/notes.md notes.md
          ls -l dist
      - name: Signing key
        env:
          KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/minisign.key"
          echo "MINISIGN_KEY_FILE=$RUNNER_TEMP/minisign.key" >> "$GITHUB_ENV"
      - name: Sign the packages
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          cd dist
          for file in ShellRS-*; do
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$MINISIGN_KEY_FILE" \
              -m "$file" -t "shellrs $VERSION $file"
          done
          sha256sum ShellRS-* > SHA256SUMS
      - name: GitHub release
        run: |
          prerelease=""
          [ "$CHANNEL" = beta ] && prerelease="--prerelease"
          gh release create "v$VERSION" dist/* --title "ShellRS $VERSION" \
            --notes-file notes.md $prerelease
      # The manifests live on the `update` branch, at v1/<channel>.json,
      # which clients read from raw.githubusercontent.com.
      - name: Manifests, last
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          manifests="$RUNNER_TEMP/manifests"
          mkdir -p "$manifests"
          publish() {
            packaging/make-manifest.sh "$VERSION" "$1" notes.md dist "$manifests/$1.json"
          }
          publish "$CHANNEL"
          beta=""
          if git fetch --depth 1 origin update; then
            branch=FETCH_HEAD
            beta=$(git show FETCH_HEAD:v1/beta.json | jq -r .manifest | jq -r .version || true)
          fi
          [ -n "$beta" ] || beta=0.0.0
          if [ "$CHANNEL" = stable ]; then
            # Beta follows stable unless it is already ahead.
            if python3 - "$VERSION" "$beta" <<'EOF'
          import sys
          def key(version):
              core, _, pre = version.partition("-")
              parts = [int(part) for part in core.split(".")]
              # A release sorts after its pre-releases.
              return parts, (1,) if not pre else (0, pre)
          sys.exit(0 if key(sys.argv[1]) > key(sys.argv[2]) else 1)
          EOF
            then
              publish beta
            fi
          fi
          if [ -n "${branch:-}" ]; then
            git checkout --force -B update "$branch"
          else
            git checkout --orphan update
            git rm -rf --quiet .
          fi
          mkdir -p v1
          cp "$manifests"/*.json v1/
          git add v1
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "$CHANNEL $VERSION"
          git push origin update
