# The Windows build, which the Macs this is developed on cannot compile:
# the whole workspace through clippy, the single-instance pipe's tests,
# the updater's, the SSH core's and the sync crate's, whose folder store
# replaces files the Windows way.
#
# A push runs it only when it touches code that differs on Windows (the
# files with `cfg(windows)` and friends, and the portable copy's), the
# build script or the dependencies. Windows code added to another file goes
# in this list too; until then, run it by hand (Actions › windows › Run
# workflow). Tags never run it: the release workflow builds Windows itself.
name: windows

on:
  push:
    branches: ["**"]
    paths:
      - "src/instance/**"
      - "src/app_lock/**"
      - "src/vault/**"
      - "crates/shellrs-ssh/src/files.rs"
      - "src/update/**"
      - "src/app/mod.rs"
      - "src/app/paths.rs"
      - "src/app/computer.rs"
      - "crates/shellrs-hosts/Cargo.toml"
      - "crates/shellrs-hosts/src/private_key.rs"
      - "src/app/window_hiding.rs"
      - "src/app/tray.rs"
      - "src/app/tray/**"
      - "src/app/quit.rs"
      - "src/settings/apply.rs"
      - "src/app/system_hotkey.rs"
      - "src/main.rs"
      - "crates/shellrs-ssh/Cargo.toml"
      - "crates/shellrs-ssh/src/connection.rs"
      - "crates/shellrs-ssh/src/probe.rs"
      - "crates/shellrs-ssh/src/transfer.rs"
      - "src/transfer/**"
      - "src/ssh/transport.rs"
      - "tests/ui/connection.rs"
      - "tests/ui/settings.rs"
      - "src/credential/credential_dialog.rs"
      - "src/settings/model.rs"
      - "src/settings/settings_panel.rs"
      - "src/terminal/local_shell.rs"
      - "src/terminal/local_pty.rs"
      - "src/project/project_panel.rs"
      - "src/workspace/tools.rs"
      - "tests/ui/projects.rs"
      - "src/terminal/zmodem.rs"
      - "src/serial/**"
      - "crates/shellrs-sync/**"
      - "src/app/shortcuts.rs"
      - "src/workspace/window_state.rs"
      - "src/testing.rs"
      - "build.rs"
      - ".cargo/config.toml"
      - "scripts/windows-runtime.ps1"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml picks the toolchain; this installs it with the
      # components it lists before the cache key is computed.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # In case aws-lc-sys wants to assemble rather than use its prebuilt
      # objects.
      - uses: ilammy/setup-nasm@v1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: "cargo test --locked --lib ssh::"
      - run: "cargo test --locked -p shellrs-ssh"
      - run: "cargo test --locked --test ui connection::"
      - run: "cargo test --locked --test ui settings::closing_to_the_tray"
      # A snippet goes after what is typed in a local terminal there.
      - run: "cargo test --locked --test ui projects::a_snippet_beside_a_local_terminal"
      - run: "cargo test --locked --lib settings::"
      # Ctrl+Shift+W, the default there, closes a tab from a terminal.
      - run: "cargo test --locked --lib app::shortcuts::"
      - run: "cargo test --locked --test ui workspace::close_shortcut"
      - run: "cargo test --locked --lib app::tray::"
      - run: "cargo test --lib instance::"
      - run: "cargo test --lib vault::"
      - run: "cargo test --lib app_lock::"
      - run: "cargo test --lib host::store"
      - run: "cargo test --lib update::"
      - run: "cargo test --lib app::paths"
      - run: "cargo test --locked -p shellrs-hosts private_key::"
      - run: "cargo test --lib terminal::local_shell"
      - run: "cargo test --lib serial::"
      - run: "cargo test --lib settings::model"
      # The program starts without the Visual C++ runtime.
      - run: cargo build --locked --bin shellrs
      - run: ./scripts/windows-runtime.ps1 target/debug
        shell: pwsh
      - run: cargo test --locked -p shellrs-sync
